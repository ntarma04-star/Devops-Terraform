name: Terraform Automation

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraformworkflowstrategy.yml'
  push:
    branches:
      - mybranch
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraformworkflowstrategy.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Choose the Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ matrix.command }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWSACCESSKEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRETS_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    strategy:
      fail-fast: false
      matrix:
        command: [validate, plan]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize Terraform
        run: terraform init

      - name: Generate Terraform plan
        if: matrix.command == 'plan'
        run: terraform plan -input=false -no-color

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' && github.ref == 'refs/heads/mybranch'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWSACCESSKEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRETS_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize Terraform
        run: terraform init

      - name: Apply Terraform changes
        run: terraform apply -input=false -auto-approve -no-color